<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>یه پیشنهاد کوچولو 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#e8799b;--rose:#b83e68;--cream:#fff9f5;--lav:#eee7ff;--ink:#49313d;--muted:#886f7a;--line:#f1dce4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Vazirmatn",Tahoma,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 12%,#ffe5ee 0,transparent 28%),radial-gradient(circle at 88% 88%,#e9e1ff 0,transparent 30%),var(--cream);display:flex;align-items:center;justify-content:center;padding:22px;overflow-x:hidden}
button,input,textarea{font:inherit}button{cursor:pointer;border:0}
.shell{width:min(760px,100%);position:relative}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:var(--muted);font-size:13px}.brand{font-weight:800;color:var(--rose)}.theme{background:#fff9;border:1px solid var(--line);padding:8px 12px;border-radius:999px;color:var(--ink)}
.card{background:#ffffffd9;border:1px solid #fff;box-shadow:0 22px 70px #9e58751c;border-radius:30px;padding:clamp(24px,5vw,48px);backdrop-filter:blur(14px);min-height:470px;display:flex;flex-direction:column;justify-content:center;animation:appear .45s ease}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.eyebrow{display:inline-flex;align-self:center;gap:8px;align-items:center;color:var(--rose);background:#fff0f5;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:700;margin-bottom:18px}
h1{font-size:clamp(27px,5vw,42px);line-height:1.55;text-align:center;margin:0 0 14px;letter-spacing:-.7px}p{line-height:2;text-align:center;color:var(--muted);margin:0 auto 22px;max-width:570px}.letter{font-size:76px;text-align:center;filter:drop-shadow(0 10px 10px #e8799b30);margin-bottom:8px;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}.btn{border-radius:16px;padding:14px 20px;font-weight:800;transition:transform .2s,box-shadow .2s,opacity .2s}.btn:hover{transform:translateY(-2px)}.primary{color:white;background:linear-gradient(135deg,var(--pink),var(--rose));box-shadow:0 10px 22px #d55a8133}.secondary{color:var(--rose);background:#fff0f5;border:1px solid #f5cfdb}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:8px}.creator{font-size:12px!important;margin-top:25px!important;margin-bottom:0!important}.creator a{color:var(--rose);direction:ltr;display:inline-block;text-decoration:none}.progress{display:flex;gap:6px;justify-content:center;margin-bottom:22px}.dot{height:5px;flex:1;max-width:70px;background:#f2dce5;border-radius:99px}.dot.active{background:var(--rose)}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0 22px}.choice{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;text-align:right;transition:.2s;min-height:112px;color:var(--ink)}.choice strong{display:block;margin-bottom:7px}.choice span{font-size:13px;color:var(--muted);line-height:1.8}.choice.selected{border:2px solid var(--pink);background:#fff4f7;box-shadow:0 8px 20px #e8799b18}.field{display:flex;flex-direction:column;gap:8px;margin:14px 0}.field label{font-size:14px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;outline:none;color:var(--ink)}.field input:focus,.field textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px #e8799b20}.field textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.note{font-size:12px!important;margin-top:10px!important}.message{min-height:30px;text-align:center;color:var(--rose);font-weight:700;margin-top:14px}.summary{background:linear-gradient(135deg,#fff3f7,#f7f2ff);border:1px solid var(--line);padding:20px;border-radius:20px;margin:16px 0}.summary div{display:flex;justify-content:space-between;gap:18px;padding:10px 0;border-bottom:1px dashed #e9cbd7}.summary div:last-child{border-bottom:0}.summary span{color:var(--muted)}.summary b{text-align:left;overflow-wrap:anywhere}.footer{text-align:center;color:#a88b98;font-size:11px;margin-top:18px}.hidden{display:none!important}.small-no{transition:all .25s}.confetti{font-size:25px;text-align:center;letter-spacing:7px;margin:8px 0 16px}
body.dark{--cream:#1e1725;--ink:#fff0f5;--muted:#c2aebb;--line:#493344;background:radial-gradient(circle at 12% 12%,#49273a 0,transparent 28%),radial-gradient(circle at 88% 88%,#30254d 0,transparent 30%),#1e1725}body.dark .card{background:#2a2030e8;border-color:#473346}body.dark .choice,body.dark .field input,body.dark .field textarea,body.dark .field select{background:#332638;color:var(--ink);border-color:#594052}body.dark .summary{background:#332638}body.dark .secondary{background:#422638}

.calendar{display:none;margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--cream);box-shadow:0 12px 30px #0002}
.calendar.open{display:block}.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cal-head button{background:var(--line);color:var(--ink);border-radius:10px;padding:7px 12px}
.cal-title{font-weight:800}.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.cal-week{font-size:12px;color:var(--muted);padding:5px 0}.cal-day{padding:9px 0;border-radius:10px;background:transparent;color:var(--ink);border:1px solid transparent}
.cal-day:hover{background:#e8799b22}.cal-day.selected{background:var(--rose);color:white}.cal-day:disabled{opacity:.25;cursor:not-allowed}
body.dark .calendar{background:#332638}.date-trigger{cursor:pointer}
@media(max-width:560px){body{padding:14px}.card{min-height:unset;padding:26px 20px;border-radius:24px}.choices{grid-template-columns:1fr}.choice{min-height:unset}.row{grid-template-columns:1fr}.topline{margin-bottom:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body class="dark">
<main class="shell">
  <div class="topline"><span class="brand">💌 یه پیشنهاد کوچولو</span><button class="theme" id="themeBtn" type="button">☀️ حالت روشن</button></div>
  <div class="progress" id="progress" aria-label="مراحل"><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <section class="card" id="app" aria-live="polite"></section>
  <div class="footer">ساخته‌شده با کمی جسارت 💗 · از طرف امیرحسین طالبی</div>
</main>
<script>
const app=document.getElementById('app'), progress=[...document.querySelectorAll('.dot')];
// After deploying the Cloudflare Worker, replace this URL with its workers.dev URL.
const EMAIL_API_URL='https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev';
const state={step:0,activity:'',date:'',jalaliDate:'',time:'18:00',firstName:'',lastName:'',phone:'',city:'',placePref:'با هم انتخاب کنیم 🤝',cafe:'',note:'',noClicks:0,prevMsg:-1,submitted:false};
const jokes=['مطمئنی؟ من حتی منوی کافه رو هم بررسی کردم! 😂','یه فرصت کوچولو به این پیشنهاد بده دیگه 🥹','قلب من الان رفت تو حالت ذخیره باتری 💔','باشه... ولی قهوه بدون تو یه چیزی کم داره ☕','این دکمه داره از خجالت آب می‌شه! 😭','فقط یه کافه‌ست، نه جلسه دفاع پایان‌نامه! 😂','من و این پیشنهاد هنوز امید داریم! 🥲','یه آره کوچولو می‌تونه روز یکی رو بسازه 💗','سیستم به این نتیجه رسید که پیشنهاد ارزش بررسی داره! 🤖','دکمه نه استعفا داد، لطفاً با دکمه آره همکاری کن! 😂'];
function faNum(s){return String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function setStep(n){state.step=n;render()}
function updateProgress(){progress.forEach((d,i)=>d.classList.toggle('active',i<=Math.min(state.step,4)))}
function render(){updateProgress();app.innerHTML=''; if(state.step===0)welcome(); if(state.step===1)invitation(); if(state.step===2)activities(); if(state.step===3)details(); if(state.step===4)summary(); if(state.step===5)success();}
function welcome(){app.innerHTML=`<div class="letter">💌</div><div class="eyebrow">یه نامه‌ی کوچولو، با کلی امید</div><h1>سلام، یه پیشنهاد کوچولو دارم برات... 💌</h1><p>این پیشنهاد با کلی فکر، کمی استرس و مقدار زیادی امید، از طرف امیرحسین طالبی آماده شده!</p><div class="actions"><button class="btn primary" id="start">یه پیشنهاد دارم، می‌خوای بدونی چیه؟ 👀</button></div><p class="creator">ساخته‌شده با کمی جسارت، کمی استرس و کلی امید 💗<br><a href="https://t.me/Amir_hossein_talebi" target="_blank" rel="noopener">@Amir_hossein_talebi</a></p>`;document.getElementById('start').onclick=()=>setStep(1)}
function invitation(){app.innerHTML=`<div class="eyebrow">مرحله‌ی اول · یه سؤال مهم</div><h1>خب، حالا که تا اینجا اومدی... 😌</h1><p>راستش یه مدته به این فکر می‌کنم که یه روز قشنگ رو با یه آدم قشنگ‌تر بگذرونم...<br><br>نظرت چیه با هم بریم بیرون؟ یه کافه دنج، یه نوشیدنی خوشمزه، کلی حرف و یه عالمه خاطره خوب؟ ☕💗</p><div class="actions" style="align-items:center"><button class="btn primary" id="yes" style="font-size:${Math.min(18+state.noClicks*2,30)}px;padding:${14+state.noClicks}px ${20+state.noClicks*2}px">آره، چرا که نه! 🥰</button><button class="btn secondary small-no ${state.noClicks>=8?'hidden':''}" id="no" style="transform:scale(${Math.max(.25,1-state.noClicks*.09)})">نه 🙄</button></div><div class="message" id="joke">${state.noClicks?'🥹 هنوز امید هست!':''}</div>`;document.getElementById('yes').onclick=()=>{app.innerHTML=`<div class="confetti">💗 ✨ 💖 ✨ 💗</div><h1>یــــس! 🥹💗</h1><p>می‌دونستم یه جایی توی این دنیا امید هست!<br><br>حالا بیا قرارمون رو با هم بچینیم.</p>`;setTimeout(()=>setStep(2),1300)};let no=document.getElementById('no');if(no)no.onclick=()=>{state.noClicks++;let idx;do{idx=Math.floor(Math.random()*jokes.length)}while(idx===state.prevMsg);state.prevMsg=idx;render();let m=document.getElementById('joke');if(m)m.textContent=jokes[idx]};}
function activities(){let opts=[['کافه دنج ☕','یه کافه آروم، قهوه یا هات‌چاکلت و حرف‌هایی که تمومی ندارن.'],['پیاده‌روی دونفره 🌿','یه مسیر قشنگ، هوای خوب و قدم‌زدن بدون عجله.'],['کافه و دسر 🍰','یه نوشیدنی خوشمزه، یه دسر جذاب و رقابت بر سر آخرین لقمه!'],['سورپرایزم کن 🎁','انتخاب با تو؛ من به سلیقه‌ات اعتماد می‌کنم.']];app.innerHTML=`<div class="eyebrow">مرحله‌ی دوم · انتخاب حال‌و‌هوا</div><h1>خب، پس بریم یه قرار خوشگل بچینیم! ✨</h1><p>اول بگو کدوم مدل قرار بیشتر به دلت می‌شینه؟</p><div class="choices">${opts.map((o,i)=>`<button class="choice ${state.activity===o[0]?'selected':''}" data-i="${i}"><strong>${o[0]} ${state.activity===o[0]?'✓':''}</strong><span>${o[1]}</span></button>`).join('')}</div><div class="message" id="err"></div><div class="actions"><button class="btn primary" id="next">خب، مرحله بعدی! 💌</button></div>`;app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{state.activity=opts[+b.dataset.i][0];render()});document.getElementById('next').onclick=()=>{if(!state.activity){document.getElementById('err').textContent='اول یکی از مدل‌های قرار رو انتخاب کن 💗';return}setStep(3)}}
function normalizeDigits(s){return String(s).replace(/[۰-۹٠-٩]/g,d=>{const fa='۰۱۲۳۴۵۶۷۸۹', ar='٠١٢٣٤٥٦٧٨٩'; return fa.includes(d)?String(fa.indexOf(d)):String(ar.indexOf(d))})}
function jalaliToGregorian(input){
  const m=normalizeDigits(input).trim().match(/^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})$/);
  if(!m) return null;
  const jy=+m[1], jm=+m[2], jd=+m[3];
  if(jy<1300||jy>1500||jm<1||jm>12||jd<1||jd>31) return null;
  const fmt=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'});
  const target=`${jy}/${jm}/${jd}`;
  // Search around Nowruz; Intl's Persian calendar is the source of truth for conversion.
  const approx=Date.UTC(jy+621,2,20,12);
  for(let offset=-370;offset<=370;offset++){
    const d=new Date(approx+offset*86400000);
    const parts=Object.fromEntries(fmt.formatToParts(d).filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));
    if(`${parts.year}/${parts.month}/${parts.day}`===target){
      const y=d.getUTCFullYear(), mo=String(d.getUTCMonth()+1).padStart(2,'0'), day=String(d.getUTCDate()).padStart(2,'0');
      return {iso:`${y}-${mo}-${day}`,jalali:`${jy}/${String(jm).padStart(2,'0')}/${String(jd).padStart(2,'0')}`};
    }
  }
  return null;
}
function details(){
  app.innerHTML=`<div class="eyebrow">مرحله‌ی سوم · جزئیات قرار</div><h1>حالا کی این قرار قشنگ رو برگزار کنیم؟ 📅</h1><p>یه روزی رو انتخاب کن که هم تو وقت داشته باشی، هم من بتونم برای یه روز خوب برنامه‌ریزی کنم.</p>
  <div class="row">
    <div class="field"><label for="firstName">نام</label><input id="firstName" type="text" autocomplete="given-name" maxlength="80" required placeholder="نام" value="${esc(state.firstName)}"></div>
    <div class="field"><label for="lastName">نام خانوادگی</label><input id="lastName" type="text" autocomplete="family-name" maxlength="100" required placeholder="نام خانوادگی" value="${esc(state.lastName)}"></div>
  </div>
  <div class="field"><label for="phone">شماره تماس</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="25" required placeholder="مثلاً 09123456789" value="${esc(state.phone)}"><small style="color:var(--muted)">شماره را با کد کشور یا به شکل معمول وارد کن.</small></div>
  <div class="field"><label for="date">تاریخ قرار (تقویم ایرانی)</label><input id="date" class="date-trigger" type="text" readonly autocomplete="off" placeholder="برای انتخاب تاریخ کلیک کن" value="${esc(state.jalaliDate||'')}" aria-haspopup="dialog" aria-expanded="false"><div class="calendar" id="calendar" role="dialog" aria-label="تقویم شمسی"><div class="cal-head"><button type="button" id="prevMonth" aria-label="ماه قبل">‹</button><span class="cal-title" id="calTitle"></span><button type="button" id="nextMonth" aria-label="ماه بعد">›</button></div><div class="cal-grid" id="calGrid"></div></div><small style="color:var(--muted)">برای انتخاب روز، روی تاریخ دلخواه در تقویم شمسی کلیک کن.</small></div>
  <div class="field"><label for="time">ساعت قرار</label><input id="time" type="time" value="${esc(state.time==='custom'?'18:00':state.time)}" step="300" aria-label="انتخاب ساعت قرار"><small style="color:var(--muted)">برای باز شدن انتخاب‌گر ساعت، روی کادر کلیک کن.</small></div>
<div class="choices">${['تو کافه رو انتخاب کن ☕','من یه جای قشنگ پیشنهاد می‌دم 🌷','با هم انتخاب کنیم 🤝'].map(t=>`<button class="choice ${state.placePref===t?'selected':''}" data-pref="${t}"><strong>${t}</strong><span>${state.placePref===t?'انتخاب شده ✓':'برای انتخاب محل قرار'}</span></button>`).join('')}</div><div class="field"><label for="note">اگه چیزی هست که دوست داری درباره قرارمون بدونم، اینجا بنویس... 💭</label><textarea id="note" placeholder="مثلاً یه جای آروم دوست دارم، یا حتماً باید دسر بخوریم! 🍰">${esc(state.note)}</textarea></div><div class="message" id="err"></div><div class="actions"><button class="btn primary" id="next">بریم خلاصه قرارمون رو ببینیم! ✨</button></div>`;
  const dateInput=document.getElementById('date'), calendar=document.getElementById('calendar');
  const timeInput=document.getElementById('time');
  let shown = (state.jalaliDate && normalizeDigits(state.jalaliDate).match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/))
    ? {year:+normalizeDigits(state.jalaliDate).split('/')[0],month:+normalizeDigits(state.jalaliDate).split('/')[1]}
    : currentJalaliMonth();
  function renderCalendar(){
    const months=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
    document.getElementById('calTitle').textContent=faNum(months[shown.month-1]+' '+shown.year);
    const grid=document.getElementById('calGrid');
    const weekdays=['ش','ی','د','س','چ','پ','ج'];
    grid.innerHTML=weekdays.map(x=>`<div class="cal-week">${x}</div>`).join('');
    const first=jalaliToGregorian(`${shown.year}/${shown.month}/1`);
    if(!first)return;
    const firstDate=new Date(first.iso+'T12:00:00');
    const offset=(firstDate.getDay()+1)%7;
    for(let i=0;i<offset;i++)grid.insertAdjacentHTML('beforeend','<span></span>');
    for(let day=1;day<=31;day++){
      const converted=jalaliToGregorian(`${shown.year}/${shown.month}/${day}`);
      if(!converted)break;
      const selected=normalizeDigits(state.jalaliDate||'')===converted.jalali;
      const today=new Date();today.setHours(0,0,0,0);
      const d=new Date(converted.iso+'T00:00:00'); const old=d<today;
      grid.insertAdjacentHTML('beforeend',`<button type="button" class="cal-day ${selected?'selected':''}" data-day="${day}" ${old?'disabled':''}>${faNum(day)}</button>`);
    }
    grid.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
      const c=jalaliToGregorian(`${shown.year}/${shown.month}/${b.dataset.day}`);
      if(c){state.jalaliDate=c.jalali;state.date=c.iso;dateInput.value=c.jalali;calendar.classList.remove('open');dateInput.setAttribute('aria-expanded','false')}
    });
  }
  dateInput.onclick=()=>{calendar.classList.toggle('open');dateInput.setAttribute('aria-expanded',calendar.classList.contains('open')?'true':'false');if(calendar.classList.contains('open'))renderCalendar()};
  document.getElementById('prevMonth').onclick=()=>{shown.month--;if(shown.month<1){shown.month=12;shown.year--}renderCalendar()};
  document.getElementById('nextMonth').onclick=()=>{shown.month++;if(shown.month>12){shown.month=1;shown.year++}renderCalendar()};
  app.querySelectorAll('[data-pref]').forEach(b=>b.onclick=()=>{saveDetails();state.placePref=b.dataset.pref;render()});
  document.getElementById('next').onclick=()=>{
    saveDetails();
    const converted=jalaliToGregorian(state.jalaliDate);
    const err=document.getElementById('err');
    if(!state.firstName || !state.lastName || !state.phone){err.textContent='لطفاً نام، نام خانوادگی و شماره تماس را کامل کن.';return}
    const normalizedPhone=state.phone.replace(/[\s()-]/g,'');
    if(!/^\+?[0-9۰-۹٠-٩]{7,20}$/.test(normalizedPhone)){err.textContent='لطفاً شماره تماس معتبر وارد کن.';return}
    if(!converted){err.textContent='لطفاً تاریخ را از تقویم شمسی انتخاب کن.';return}
    const today=new Date(); today.setHours(0,0,0,0);
    const chosen=new Date(`${converted.iso}T00:00:00`);
    if(chosen<today){err.textContent='لطفاً یکی از روزهای آینده را انتخاب کن.';return}
    state.date=converted.iso;state.jalaliDate=converted.jalali;
    if(!timeInput.value){err.textContent='لطفاً ساعت قرار را انتخاب کن.';return}
    state.time=timeInput.value;
    setStep(4);
  };
}
function currentJalaliMonth(){
  const parts=new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date());
  const p=Object.fromEntries(parts.filter(x=>x.type!=='literal').map(x=>[x.type,+x.value]));
  return {year:p.year,month:p.month};
}
function saveDetails(){
  const firstNameInput=document.getElementById('firstName'); if(firstNameInput) state.firstName=firstNameInput.value.trim();
  const lastNameInput=document.getElementById('lastName'); if(lastNameInput) state.lastName=lastNameInput.value.trim();
  const phoneInput=document.getElementById('phone'); if(phoneInput) state.phone=phoneInput.value.trim();
  const dateInput=document.getElementById('date');
  if(dateInput) state.jalaliDate=dateInput.value.trim();
  state.note=document.getElementById('note')?.value||'';
  let t=document.getElementById('time');
  if(t && t.value) state.time=t.value;
}
function summary(){app.innerHTML=`<div class="eyebrow">مرحله‌ی چهارم · مرور نهایی</div><h1>خب، پس داریم یه خاطره قشنگ می‌سازیم! 💗</h1><div class="summary"><div><span>نام و نام خانوادگی</span><b>${esc((state.firstName+' '+state.lastName).trim()||'—')}</b></div><div><span>شماره تماس</span><b>${esc(state.phone||'—')}</b></div><div><span>تعداد انتخاب «نه»</span><b>${faNum(state.noClicks)}</b></div><div><span>مدل قرار</span><b>${esc(state.activity)}</b></div><div><span>تاریخ انتخابی</span><b>${esc(state.jalaliDate||'—')}</b></div><div><span>ساعت</span><b>${esc(state.time)}</b></div><div><span>شهر یا محله</span><b>—</b></div><div><span>ترجیح محل</span><b>${esc(state.placePref)}</b></div>${state.note?`<div><span>یادداشت</span><b>${esc(state.note)}</b></div>`:''}</div><p>پس فعلاً قرارمون اینه:<br>یه روز قشنگ، یه جای دنج، یه نوشیدنی خوشمزه و دو نفر که قراره چند ساعت از روزشون رو به هم اختصاص بدن. ☕🌷<br><br>حالا دیگه باید منتظر یه روز خوب باشیم!</p><div class="message" id="err"></div><div class="actions"><button class="btn secondary" id="edit">می‌خوام تغییرش بدم</button><button class="btn primary" id="submit">همه‌چی درسته، ثبتش کن! 💌</button></div><p class="note">این فقط یک پیشنهاد برای قرار است؛ تاریخ نهایی وقتی قطعی می‌شود که هر دو نفر موافق باشند.</p>`;document.getElementById('edit').onclick=()=>setStep(3);document.getElementById('submit').onclick=async()=>{const btn=document.getElementById('submit'),err=document.getElementById('err');btn.disabled=true;btn.textContent='در حال ارسال…';err.textContent='';const controller=new AbortController();const timeoutId=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(EMAIL_API_URL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},signal:controller.signal,body:JSON.stringify({first_name:state.firstName,last_name:state.lastName,phone:state.phone,no_click_count:state.noClicks,activity:state.activity,date_jalali:state.jalaliDate,date_gregorian:state.date,time:state.time,place_preference:state.placePref,note:state.note||'بدون توضیح',invitation_response:'آره، چرا که نه!',website:''})});const raw=await response.text();let data={};try{data=JSON.parse(raw)}catch{}if(!response.ok||data.success===false){throw new Error(data.error||data.message||'ارسال ایمیل انجام نشد. تنظیمات سرویس ایمیل را بررسی کن.')}state.submissionId='';state.emailSent=true;state.submitted=true;setStep(5)}catch(e){if(e.name==='AbortError'){err.textContent='پاسخ سرویس ایمیل تا ۱۲ ثانیه دریافت نشد. ممکن است درخواست هنوز در حال پردازش باشد؛ پیش از تلاش دوباره، ایمیل را بررسی کن تا پیام تکراری ارسال نشود.'}else{err.textContent=e.message||'ارسال انجام نشد. اتصال اینترنت را بررسی کن و دوباره تلاش کن.'}btn.disabled=false;btn.textContent='دوباره تلاش کن 💌'}finally{clearTimeout(timeoutId)}}}
function success(){progress.forEach(d=>d.classList.add('active'));app.innerHTML=`<div class="confetti">💗 ✨ ☕ ✨ 💗</div><h1>پیشنهاد قرارمون ثبت شد! 🥹💗</h1><p>حالا دیگه باید برای یه روز قشنگ برنامه‌ریزی کنیم!<br><br>${state.emailSent?'اطلاعات برای ارسال به سرویس ایمیل تحویل داده شد.':'اطلاعات برای ارسال ثبت شد.'}<br><small>این تاریخ پیشنهادی است و وقتی قطعی می‌شود که هر دو نفر موافق باشند.</small></p><div class="summary"><div><span>قرار پیشنهادی</span><b>${esc(state.activity)}</b></div><div><span>تاریخ انتخابی</span><b>${esc(state.jalaliDate||state.date)}</b></div><div><span>ساعت</span><b>${esc(state.time)}</b></div></div><div class="actions"><button class="btn primary" id="restart">شروع دوباره 💌</button></div>`;document.getElementById('restart').onclick=()=>{Object.assign(state,{step:0,activity:'',date:'',jalaliDate:'',time:'18:00',firstName:'',lastName:'',phone:'',city:'',placePref:'با هم انتخاب کنیم 🤝',cafe:'',note:'',noClicks:0,prevMsg:-1,submitted:false,submissionId:'',emailSent:false});setStep(0)}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('themeBtn').onclick=()=>{document.body.classList.toggle('dark');document.getElementById('themeBtn').textContent=document.body.classList.contains('dark')?'☀️ حالت روشن':'🌙 حالت شب'};
render();
</script>
